<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="260" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">程式在生成式藝術裡做三件事</text><rect x="32" y="88" width="218" height="104" rx="9" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="141" y="118" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">形狀的生成</text><text x="141" y="146" font-size="11" fill="#f2ece1" text-anchor="middle" font-weight="400">用數學函數定義圖形</text><text x="141" y="168" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">或用隨機函數做出不確定的形狀</text><rect x="260" y="88" width="218" height="104" rx="9" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="369" y="118" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600">顏色的變化</text><text x="369" y="146" font-size="11" fill="#f2ece1" text-anchor="middle" font-weight="400">定義漸變規則</text><text x="369" y="168" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">或讓顏色隨機變動</text><rect x="488" y="88" width="218" height="104" rx="9" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="597" y="118" font-size="14" fill="#d98a7b" text-anchor="middle" font-weight="600">使用者互動</text><text x="597" y="146" font-size="11" fill="#f2ece1" text-anchor="middle" font-weight="400">回應點擊、滑動、鍵盤</text><text x="597" y="168" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">或時間、光線、聲音的變化</text><text x="360" y="224" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">同一份程式碼改一個參數就是一次實驗，改完立刻看到結果</text><text x="360" y="248" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">這種迭代速度是手工創作給不了的</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>