<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="280" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">作品完成之後</text><rect x="50" y="88" width="290" height="130" rx="10" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="195" y="118" font-size="15" fill="#d98a7b" text-anchor="middle" font-weight="600">傳統藝術</text><text x="195" y="148" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">《蒙娜麗莎》《沉思者》</text><text x="195" y="176" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">每個細節都是刻意決定的</text><text x="195" y="200" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">完成後就固定，不會再變</text><rect x="380" y="88" width="290" height="130" rx="10" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="525" y="118" font-size="15" fill="#6fbfae" text-anchor="middle" font-weight="600">生成式藝術</text><text x="525" y="148" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">互動裝置・生成音樂</text><text x="525" y="176" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">隨觀眾、時間、變數而變</text><text x="525" y="200" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">每次看到的可能都不一樣</text><text x="360" y="250" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">解讀可以很多樣，但左邊那件東西本身不會再變</text><text x="360" y="274" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">不可預測不等於失控：隨機的範圍是你定的</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>