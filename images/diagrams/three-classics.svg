<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="260" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">三件把「結果交給系統與參與者」做完的作品</text><rect x="32" y="88" width="218" height="110" rx="9" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="141" y="120" font-size="14" fill="#d98a7b" text-anchor="middle" font-weight="600">Cut Piece</text><text x="141" y="145" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">Yoko Ono</text><text x="141" y="172" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">觀眾上台，自由剪下一片衣物</text><rect x="260" y="88" width="218" height="110" rx="9" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="369" y="120" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">4&#x27;33&quot;</text><text x="369" y="145" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">John Cage</text><text x="369" y="172" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">沒有預定的音樂，聽現場當下的聲音</text><rect x="488" y="88" width="218" height="110" rx="9" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="597" y="120" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600">The Artist is Present</text><text x="597" y="145" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">Marina Abramović</text><text x="597" y="172" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">觀眾與她對坐，無言相望</text><text x="360" y="232" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">三件都不是電腦作品，但它們把生成式的核心先做完了</text><text x="360" y="254" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">隨機性進入藝術，遠早於電腦</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>