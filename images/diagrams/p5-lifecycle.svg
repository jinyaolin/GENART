<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="310" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">p5.js 的執行流程</text><rect x="150" y="78" width="300" height="54" rx="8" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="300" y="101" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">preload()</text><text x="300" y="121" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">載入圖片・音訊・JSON</text><text x="462" y="109" font-size="11.5" fill="#6fbfae" text-anchor="start" font-weight="400">沒跑完，後面都不開始</text><line x1="300" y1="132" x2="300" y2="148" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="150" y="148" width="300" height="54" rx="8" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="300" y="171" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">setup()</text><text x="300" y="191" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">建立畫布・初始設定</text><text x="462" y="179" font-size="11.5" fill="#e0a94e" text-anchor="start" font-weight="400">只執行一次</text><line x1="300" y1="202" x2="300" y2="218" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="150" y="218" width="300" height="54" rx="8" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="300" y="241" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">draw()</text><text x="300" y="261" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">繪製與更新畫面</text><path d="M 450 245 L 508 245 L 508 205 L 456 205" fill="none" stroke="#e0a94e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="520" y="229" font-size="11.5" fill="#e0a94e" text-anchor="start" font-weight="400">每秒約 60 次</text><text x="520" y="249" font-size="11" fill="#a89f92" text-anchor="start" font-weight="400">不斷重複</text><rect x="40" y="205" width="90" height="54" rx="8" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="85" y="228" font-size="13" fill="#d98a7b" text-anchor="middle" font-weight="600">事件</text><text x="85" y="248" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">滑鼠・鍵盤</text><line x1="132" y1="232" x2="146" y2="232" stroke="#d98a7b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="85" y="278" font-size="10.5" fill="#6d6459" text-anchor="middle" font-weight="400">獨立於 draw 之外</text><text x="360" y="296" font-size="12.5" fill="#a89f92" text-anchor="middle" font-weight="400">一次性的事寫在 setup，會動的事寫在 draw</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>