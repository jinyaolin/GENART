<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="260" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">一次訓練迭代</text><rect x="28" y="95" width="124" height="58" rx="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="90" y="122" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">初始化</text><text x="90" y="143" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">隨機給權重</text><line x1="152" y1="124" x2="158" y2="124" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="162" y="95" width="124" height="58" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="224" y="122" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">前向傳播</text><text x="224" y="143" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">算出預測</text><line x1="286" y1="124" x2="292" y2="124" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="296" y="95" width="124" height="58" rx="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="358" y="122" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">計算損失</text><text x="358" y="143" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">和答案差多少</text><line x1="420" y1="124" x2="426" y2="124" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="430" y="95" width="124" height="58" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="492" y="122" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">反向傳播</text><text x="492" y="143" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">算每個權重的責任</text><line x1="554" y1="124" x2="560" y2="124" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="564" y="95" width="124" height="58" rx="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="626" y="122" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">更新參數</text><text x="626" y="143" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">照梯度調整</text><path d="M 690 153 L 690 195 L 90 195 L 90 160" fill="none" stroke="#e0a94e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="390" y="215" font-size="12.5" fill="#a89f92" text-anchor="middle" font-weight="400">重複，直到表現夠好或不再進步</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>