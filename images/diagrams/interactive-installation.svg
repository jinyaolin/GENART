<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="250" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">互動裝置：生成的來源是人</text><rect x="40" y="95" width="150" height="58" rx="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="115" y="122" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">攝影機</text><text x="115" y="143" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">捕捉觀眾的動作</text><line x1="190" y1="124" x2="226" y2="124" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="228" y="95" width="150" height="58" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="303" y="122" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">資料</text><text x="303" y="143" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">座標・速度・人數</text><line x1="378" y1="124" x2="414" y2="124" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="416" y="95" width="150" height="58" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="491" y="122" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">演算法</text><text x="491" y="143" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">把資料映射成參數</text><line x1="566" y1="124" x2="602" y2="124" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="604" y="95" width="150" height="58" rx="7" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="679" y="122" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">輸出</text><text x="679" y="143" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">視覺・聲音・動作</text><path d="M 665 153 L 690 153 L 690 195 L 60 195 L 60 160" fill="none" stroke="#d98a7b" stroke-width="1.8" stroke-dasharr