<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" width="720" height="285" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="285" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">順序很重要：縮放、旋轉、平移不能交換</text><rect x="90" y="95" width="200" height="110" rx="6" fill="none" stroke="#3a3026" stroke-width="1.2"/><circle cx="190" cy="150" r="3" fill="#6d6459" stroke="#6d6459" stroke-width="0"/><g transform="translate(190,150) translate(30,0) rotate(30) scale(1.5)"><rect x="-20" y="-11" width="40" height="22" fill="none" stroke="#6fbfae" stroke-width="1.6"/><circle cx="0" cy="0" r="2" fill="#6fbfae"/></g><text x="190" y="228" font-size="12" fill="#6fbfae" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">scale → rotate → translate</text><rect x="430" y="95" width="200" height="110" rx="6" fill="none" stroke="#3a3026" stroke-width="1.2"/><circle cx="530" cy="150" r="3" fill="#6d6459" stroke="#6d6459" stroke-width="0"/><g transform="translate(530,150) scale(1.5) rotate(30) translate(30,0)"><rect x="-20" y="-11" width="40" height="22" fill="none" stroke="#d98a7b" stroke-width="1.6"/><circle cx="0" cy="0" r="2" fill="#d98a7b"/></g><text x="530" y="228" font-size="12" fill="#d98a7b" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">translate → rotate → scale</text><text x="360" y="256" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">同樣三個變換，換個順序，物件就跑到別的地方去了</text><text x="360" y="278" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">把每個物件包在 push() 與 pop() 之間，才不會互相污染</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>