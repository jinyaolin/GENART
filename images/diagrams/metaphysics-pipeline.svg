<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="300" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">draw() 分兩階段，畫在三張畫布上</text><rect x="45" y="88" width="300" height="120" rx="9" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="195" y="112" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">階段一：長東西</text><text x="195" y="138" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">檢查每條 spine 是否出界或壽命結束</text><text x="195" y="160" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">還活著的就畫上去</text><text x="195" y="186" font-size="11.5" fill="#f0c87d" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">畫在 tempcnv</text><line x1="345" y1="148" x2="385" y2="148" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="385" y="88" width="290" height="120" rx="9" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="530" y="112" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600">階段二：後製</text><text x="530" y="138" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">清空特效畫布</text><text x="530" y="160" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">把特效畫布疊回主畫布</text><text x="530" y="186" font-size="11.5" fill="#f0c87d" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">noise(0.4).ink(0.15)</text><rect x="60" y="228" width="190" height="42" rx="6" fill="none" stroke="#3a3026" stroke-width="1.4"/><text x="155" y="247" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">tempcnv</text><text x="155" y="264" font-size="10" fill="#a89f92" text-anchor="middle" font-weight="400">leaf 與 spine 畫這</text><rect x="265" y="228" width="190" height="42" rx="6" fill="none" stroke="#3a3026" stroke-width="1.4"/><text x="360" y="247" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">backgroundcnv</text><text x="360" y="264" font-size="10" fill="#a89f92" text-anchor="middle" font-weight="400">底色</text><rect x="470" y="228" width="190" height="42" rx="6" fill="none" stroke="#3a3026" stroke-width="1.4"/><text x="565" y="247" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">特效畫布</text><text x="565" y="264" font-size="10" fill="#a89f92" text-anchor="middle" font-weight="400">顆粒與墨感</text><text x="360" y="292" font-size="12.5" fill="#a89f92" text-anchor="middle" font-weight="400">兩件事分開，邏輯才不會纏在一起；分層才能各自重畫或套效果</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>