<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" width="720" height="318" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="318" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">Mandelbrot：這個點會不會跑掉</text><text x="190" y="80" font-size="12.5" fill="#6fbfae" text-anchor="middle" font-weight="600">留在裡面 → 屬於集合 → 塗黑</text><circle cx="190" cy="175" r="62" fill="none" stroke="#3a3026" stroke-width="1.5"/><text x="190" y="246" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">跑滿 100 次還沒逃走</text><path d="M190.0,175.0 L234.6,162.2 L209.3,182.1 L210.4,140.5 L176.8,151.2 L161.5,152.7 L170.1,163.9 L163.0,187.6 L181.8,127.9 L222.6,164.2" fill="none" stroke="#6fbfae" stroke-width="1.8"/><circle cx="190" cy="175" r="2.5" fill="#6fbfae" stroke="#6fbfae" stroke-width="0"/><circle cx="234.636" cy="162.199" r="2.5" fill="#6fbfae" stroke="#6fbfae" stroke-width="0"/><circle cx="209.264" cy="182.144" r="2.5" fill="#6fbfae" stroke="#6fbfae" stroke-width="0"/><circle cx="210.418" cy="140.512" r="2.5" fill="#6fbfae" stroke="#6fbfae" stroke-width="0"/><circle cx="176.784" cy="151.176" r="2.5" fill="#6fbfae" stroke="#6fbfae" stroke-width="0"/><circle cx="161.482" cy="152.696" r="2.5" fill="#6fbfae" stroke="#6fbfae" stroke-width="0"/><circle cx="170.126" cy="163.926" r="2.5" fill="#6fbfae" stroke="#6fbfae" stroke-width="0"/><circle cx="162.995" cy="187.614" r="2.5" fill="#6fbfae" stroke="#6fbfae" stroke-width="0"/><circle cx="181.817" cy="127.86" r="2.5" fill="#6fbfae" stroke="#6fbfae" stroke-width="0"/><circle cx="222.572" cy="164.17" r="2.5" fill="#6fbfae" stroke="#6fbfae" stroke-width="0"/><text x="530" y="80" font-size="12.5" fill="#d98a7b" text-anchor="middle" font-weight="600">跑出去 → 不屬於 → 依速度上色</text><circle cx="530" cy="175" r="62" fill="none" stroke="#3a3026" stroke-width="1.5"/><path d="M530.0,175.0 L545.5,175.0 L531.7,199.0 L493.1,180.3 L517.8,118.6 L615.9,150.0 L578.1,305.1 L334.2,263.6" fill="none" stroke="#d98a7b" stroke-width="1.8"/><circle cx="530" cy="175" r="2.5" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><circle cx="545.5" cy="175" r="2.5" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><circle cx="531.699" cy="198.965" r="2.5" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><circle cx="493.134" cy="180.255" r="2.5" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><circle cx="517.833" cy="118.577" r="2.5" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><circle cx="615.903" cy="150.002" r="2.5" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><circle cx="578.069" cy="305.075" r="2.5" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><circle cx="334.16" cy="263.582" r="2.5" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><text x="530" y="246" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">第幾次逃走，就決定它的顏色</text><text x="360" y="278" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">圖案的全部細節都在邊界那一圈：那裡的點差一點點就會分屬兩邊</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>