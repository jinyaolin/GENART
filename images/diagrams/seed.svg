<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="280" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">亂數種子：為什麼生成式作品非有它不可</text><rect x="50" y="95" width="150" height="52" rx="7" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="125" y="119" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">種子</text><text x="125" y="140" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">鏈上雜湊</text><line x1="200" y1="121" x2="238" y2="121" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="243" y="95" width="150" height="52" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="318" y="119" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">生成器</text><text x="318" y="140" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">sfc32</text><line x1="393" y1="121" x2="431" y2="121" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="436" y="95" width="234" height="52" rx="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="553" y="127" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">0.417  0.902  0.135  0.788</text><text x="553" y="163" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">一長串看起來隨機的序列</text><text x="360" y="205" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">同一顆種子 → 同一串序列，換機器、換時間都一樣</text><text x="360" y="235" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">收藏家買到的那一版，每次打開都必須長一模一樣</text><text x="360" y="262" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">作品裡不要再出現裸的 random()，漏一個那張圖就不可重現</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>