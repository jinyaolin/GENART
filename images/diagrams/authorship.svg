<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="270" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">一個程式畫出來的畫，作者是誰</text><rect x="70" y="95" width="240" height="90" rx="10" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="190" y="128" font-size="16" fill="#e0a94e" text-anchor="middle" font-weight="600">寫規則的人</text><text x="190" y="158" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">決定了可能性的範圍</text><text x="360" y="145" font-size="30" fill="#f0c87d" text-anchor="middle" font-weight="600">？</text><rect x="410" y="95" width="240" height="90" rx="10" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="530" y="128" font-size="16" fill="#6fbfae" text-anchor="middle" font-weight="600">跑規則的機器</text><text x="530" y="158" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">決定了這一張的樣子</text><text x="360" y="222" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">這個問題在 1970 年代的 AARON 就被提出來了</text><text x="360" y="250" font-size="12.5" fill="#a89f92" text-anchor="middle" font-weight="400">到今天的生成式 AI 也還沒有標準答案</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>