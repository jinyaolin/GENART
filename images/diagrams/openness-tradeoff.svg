<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="270" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">開放與品質，很難同時要</text><line x1="110" y1="140" x2="610" y2="140" stroke="#3a3026" stroke-width="3"/><text x="110" y="114" font-size="13" fill="#e0a94e" text-anchor="middle" font-weight="600">嚴格策展</text><text x="610" y="114" font-size="13" fill="#6fbfae" text-anchor="middle" font-weight="600">完全開放</text><text x="110" y="168" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">品質穩定</text><text x="610" y="168" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">人人可進</text><text x="110" y="190" font-size="11.5" fill="#6d6459" text-anchor="middle" font-weight="400">但排不進去</text><text x="610" y="190" font-size="11.5" fill="#6d6459" text-anchor="middle" font-weight="400">但詐騙者也進來</text><circle cx="610" cy="140" r="10" fill="#1d1811" stroke="#6fbfae" stroke-width="3"/><circle cx="110" cy="140" r="10" fill="#1d1811" stroke="#e0a94e" stroke-width="3"/><text x="360" y="206" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">fxhash 補上檢舉、審核、標記與鑄造鎖定，把安全性拉回來一些</text><text x="360" y="234" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">所有開放平台都會遇到同一個題目</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>