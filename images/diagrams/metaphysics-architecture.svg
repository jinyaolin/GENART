<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="300" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">METAPHYSICS：整件作品只有兩個類別</text><rect x="70" y="90" width="240" height="72" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="190" y="124" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">leaf</text><text x="190" y="145" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">一片葉子的形狀與外觀</text><rect x="410" y="90" width="240" height="72" rx="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="530" y="124" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">spine</text><text x="530" y="145" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">一條路徑的生長</text><line x1="310" y1="126" x2="405" y2="126" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><text x="357" y="114" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">帶著走</text><text x="190" y="196" font-size="13" fill="#e0a94e" text-anchor="middle" font-weight="600">長什麼樣</text><text x="530" y="196" font-size="13" fill="#6fbfae" text-anchor="middle" font-weight="600">往哪裡去</text><text x="190" y="220" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">noise 給起伏</text><text x="190" y="240" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">sin 給輪廓</text><text x="530" y="220" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">noise 轉成角度增量</text><text x="530" y="240" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">有生命、會死亡</text><text x="360" y="276" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">一個管長什麼樣，一個管往哪裡去。整張畫面就是這兩件事的重複。</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>