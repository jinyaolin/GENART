<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="270" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">一個雜湊，切成兩個生成器</text><rect x="120" y="80" width="480" height="40" rx="6" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="360" y="106" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">0x  a3f9…（128 bit）  …7c21</text><line x1="240" y1="124" x2="240" y2="152" stroke="#d98a7b" stroke-width="1.6" marker-end="url(#ar)"/><line x1="480" y1="124" x2="480" y2="152" stroke="#d98a7b" stroke-width="1.6" marker-end="url(#ar)"/><rect x="160" y="155" width="160" height="48" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="240" y="177" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">prngA</text><text x="240" y="198" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">substr(2, 32)</text><rect x="400" y="155" width="160" height="48" rx="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="480" y="177" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">prngB</text><text x="480" y="198" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">substr(34, 32)</text><text x="360" y="232" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">每次取值輪流用 A 和 B，取值前先空轉一百萬次</text><text x="360" y="256" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">剛初始化時的輸出和種子相關性太高，燒掉那一段才夠均勻</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>