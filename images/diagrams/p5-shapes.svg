<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="300" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">基本形狀的參數落在哪裡</text><rect x="85" y="92" width="90" height="56" rx="2" fill="none" stroke="#e0a94e" stroke-width="2"/><circle cx="85" cy="92" r="4" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><text x="130" y="178" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">rect(x,y,w,h)</text><text x="130" y="198" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">(x,y) 是左上角</text><rect x="265" y="92" width="90" height="56" rx="2" fill="none" stroke="#e0a94e" stroke-width="2"/><circle cx="310" cy="120" r="4" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><text x="310" y="178" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">rectMode(CENTER)</text><text x="310" y="198" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">(x,y) 變成中心</text><circle cx="490" cy="120" r="30" fill="none" stroke="#e0a94e" stroke-width="2"/><circle cx="490" cy="120" r="4" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><line x1="490" y1="120" x2="520" y2="120" stroke="#6fbfae" stroke-width="1.5"/><text x="490" y="178" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">circle(x,y,d)</text><text x="490" y="198" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">(x,y) 是圓心，d 是直徑</text><polygon points="640,90 602,146 678,146" fill="none" stroke="#e0a94e" stroke-width="2"/><circle cx="640" cy="90" r="4" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><circle cx="602" cy="146" r="4" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><circle cx="678" cy="146" r="4" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><text x="640" y="178" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">triangle(…)</text><text x="640" y="198" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">三個頂點</text><text x="360" y="262" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">紅點是你給的座標。搞錯它在哪，圖就會整個偏掉。</text><text x="360" y="286" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">不確定就查 Reference，沒有人背得起來全部</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>