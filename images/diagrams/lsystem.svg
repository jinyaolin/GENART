<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="290" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">L-system：規則與呈現分離</text><text x="140" y="86" font-size="13" fill="#e0a94e" text-anchor="middle" font-weight="600">① 生成字串</text><rect x="50" y="100" width="240" height="86" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="170" y="126" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">X → X+YF+</text><text x="170" y="150" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Y → -FX-Y</text><text x="170" y="174" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">從 &quot;FX&quot; 開始反覆替換</text><line x1="295" y1="143" x2="345" y2="143" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><text x="470" y="86" font-size="13" fill="#6fbfae" text-anchor="middle" font-weight="600">② 照字串畫圖</text><rect x="350" y="100" width="320" height="86" rx="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="392" y="122" font-size="11.5" fill="#f0c87d" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">F</text><text x="430" y="122" font-size="11" fill="#a89f92" text-anchor="start" font-weight="400">前進並畫線</text><text x="392" y="139" font-size="11.5" fill="#f0c87d" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">+</text><text x="430" y="139" font-size="11" fill="#a89f92" text-anchor="start" font-weight="400">左轉 90°</text><text x="392" y="156" font-size="11.5" fill="#f0c87d" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">-</text><text x="430" y="156" font-size="11" fill="#a89f92" text-anchor="start" font-weight="400">右轉 90°</text><text x="392" y="173" font-size="11.5" fill="#f0c87d" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">X Y</text><text x="430" y="173" font-size="11" fill="#a89f92" text-anchor="start" font-weight="400">不做任何事</text><text x="360" y="222" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">X 與 Y 只是生成用的符號，畫圖時不對應任何動作</text><text x="360" y="250" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">同一組字串換一套畫法，就是另一件作品</text><text x="360" y="276" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">這是 L-system 最該學起來的一點</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>