<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="300" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">座標系統：原點在左上角，y 向下為正</text><rect x="230" y="80" width="260" height="180" rx="4" fill="none" stroke="#3a3026" stroke-width="1.5"/><circle cx="230" cy="80" r="5" fill="#e0a94e" stroke="#e0a94e" stroke-width="0"/><text x="218" y="70" font-size="12" fill="#e0a94e" text-anchor="end" font-weight="600">(0, 0)</text><line x1="230" y1="80" x2="480" y2="80" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><text x="504" y="85" font-size="12" fill="#e0a94e" text-anchor="start" font-weight="400">x  向右為正</text><line x1="230" y1="80" x2="230" y2="250" stroke="#d98a7b" stroke-width="2" marker-end="url(#ar)"/><text x="216" y="240" font-size="12" fill="#d98a7b" text-anchor="end" font-weight="400">y</text><text x="216" y="260" font-size="12" fill="#d98a7b" text-anchor="end" font-weight="400">向下為正</text><circle cx="380" cy="150" r="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="380" y="174" font-size="11.5" fill="#6fbfae" text-anchor="middle" font-weight="400">(150, 70)</text><text x="360" y="282" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">想把東西往上移，要「減」y，不是加。這是初學者最常撞到的坑。</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>