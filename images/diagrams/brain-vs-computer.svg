<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="290" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">人腦與電腦</text><text x="200" y="82" font-size="16" fill="#d98a7b" text-anchor="middle" font-weight="600">人腦</text><text x="520" y="82" font-size="16" fill="#6fbfae" text-anchor="middle" font-weight="600">電腦</text><text x="200" y="112" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">約 860 億個神經元</text><text x="520" y="112" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">處理器與記憶體</text><line x1="60" y1="121" x2="660" y2="121" stroke="#3a3026" stroke-width="1" opacity="0.5"/><text x="200" y="142" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">化學物質傳訊號</text><text x="520" y="142" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">電子訊號</text><line x1="60" y1="151" x2="660" y2="151" stroke="#3a3026" stroke-width="1" opacity="0.5"/><text x="200" y="172" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">大量並行</text><text x="520" y="172" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">極快，但偏向循序</text><line x1="60" y1="181" x2="660" y2="181" stroke="#3a3026" stroke-width="1" opacity="0.5"/><text x="200" y="202" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">自己從經驗中學</text><text x="520" y="202" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">要人寫程式教它</text><line x1="60" y1="211" x2="660" y2="211" stroke="#3a3026" stroke-width="1" opacity="0.5"/><text x="200" y="232" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">能自我修復</text><text x="520" y="232" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">需要人維修</text><line x1="60" y1="241" x2="660" y2="241" stroke="#3a3026" stroke-width="1" opacity="0.5"/><text x="360" y="278" font-size="12.5" fill="#a89f92" text-anchor="middle" font-weight="400">神經網路是「試圖模仿左邊」的計算模型，不是左邊本身</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>