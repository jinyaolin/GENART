olas,monospace">R</text><text x="462" y="168" font-size="10.5" fill="#6d6459" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">8</text><rect x="486" y="110" width="40" height="40" rx="4" fill="none" stroke="#6fbfae" stroke-width="1.6"/><text x="506" y="136" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">G</text><text x="506" y="168" font-size="10.5" fill="#6d6459" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">9</text><rect x="530" y="110" width="40" height="40" rx="4" fill="none" stroke="#7f9fd8" stroke-width="1.6"/><text x="550" y="136" font-size="14" fill="#7f9fd8" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">B</text><text x="550" y="168" font-size="10.5" fill="#6d6459" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">10</text><rect x="574" y="110" width="40" height="40" rx="4" fill="none" stroke="#6d6459" stroke-width="1.6"/><text x="594" y="136" font-size="14" fill="#6d6459" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">A</text><text x="594" y="168" font-size="10.5" fill="#6d6459" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">11</text><line x1="90" y1="96" x2="266" y2="96" stroke="#f0c87d" stroke-width="1.6"/><text x="178" y="86" font-size="11" fill="#f0c87d" text-anchor="middle" font-weight="400">第 0 個像素</text><line x1="266" y1="96" x2="442" y2="96" stroke="#f0c87d" stroke-width="1.6"/><text x="354" y="86" font-size="11" fill="#f0c87d" text-anchor="middle" font-weight="400">第 1 個像素</text><line x1="442" y1="96" x2="618" y2="96" stroke="#f0c87d" stroke-width="1.6"/><text x="530" y="86" font-size="11" fill="#f0c87d" text-anchor="middle" font-weight="400">第 2 個像素</text><text x="360" y="206" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">陣列長度是像素總數的四倍，所以遍歷時步長要用 4</text><text x="360" y="232" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">改完一定要呼叫 updatePixels()，否則畫面不會變</text><text x="360" y="254" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">忘記這一步，是初學者最常見的「程式沒錯但畫面沒動」</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>