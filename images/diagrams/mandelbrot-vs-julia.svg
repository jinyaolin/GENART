<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="290" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">Mandelbrot 與 Julia：同一條公式，誰固定對調</text><text x="190" y="84" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">Mandelbrot</text><rect x="90" y="100" width="200" height="44" rx="6" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="190" y="128" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">每個像素決定 c</text><text x="190" y="168" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">z₀ 固定為 0</text><text x="530" y="84" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600">Julia</text><rect x="430" y="100" width="200" height="44" rx="6" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="530" y="128" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">每個像素決定 z₀</text><text x="530" y="168" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">c 固定為一個常數</text><rect x="210" y="196" width="300" height="44" rx="6" fill="none" stroke="#f0c87d" stroke-width="2"/><text x="360" y="225" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">z = z² + c</text><line x1="190" y1="180" x2="300" y2="194" stroke="#3a3026" stroke-width="1.4"/><line x1="530" y1="180" x2="420" y2="194" stroke="#3a3026" stroke-width="1.4"/><text x="360" y="270" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">程式碼只差一個字：a = aa + ca 換成 a = aa + cX</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>