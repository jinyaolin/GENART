<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="290" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">GAN：兩個網路互相對抗</text><rect x="70" y="95" width="190" height="62" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="165" y="124" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">生成器</text><text x="165" y="145" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">從雜訊做出假樣本</text><rect x="460" y="95" width="190" height="62" rx="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="555" y="124" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">鑑別器</text><text x="555" y="145" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">分辨真假</text><line x1="260" y1="112" x2="455" y2="112" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><text x="357" y="102" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">生成的樣本</text><line x1="455" y1="145" x2="265" y2="145" stroke="#6fbfae" stroke-width="2" marker-end="url(#ar)"/><text x="357" y="163" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">你被我抓到了</text><line x1="555" y1="212" x2="555" y2="162" stroke="#6fbfae" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="555" y="232" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">真實資料</text><line x1="165" y1="212" x2="165" y2="162" stroke="#e0a94e" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="165" y="232" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">隨機雜訊</text><text x="360" y="262" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">生成器想騙過鑑別器，鑑別器想抓出生成器。兩邊同時在進步。</text><text x="360" y="282" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">訓練夠久之後，生成器做出的樣本鑑別器已經分不出來</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>