<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="240" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">不確定性的三種來源</text><rect x="45" y="80" width="200" height="105" rx="10" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="145" y="112" font-size="17" fill="#e0a94e" text-anchor="middle" font-weight="600">亂數</text><text x="145" y="140" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">鏈上雜湊決定</text><text x="145" y="164" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">Fidenza・Ringers</text><rect x="258" y="80" width="200" height="105" rx="10" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="358" y="112" font-size="17" fill="#6fbfae" text-anchor="middle" font-weight="600">觀眾</text><text x="358" y="140" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">行為即時驅動</text><text x="358" y="164" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">Lozano-Hemmer</text><rect x="471" y="80" width="200" height="105" rx="10" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="571" y="112" font-size="17" fill="#d98a7b" text-anchor="middle" font-weight="600">時間</text><text x="571" y="140" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">永遠不重複播放</text><text x="571" y="164" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">Brian Eno</text><text x="360" y="215" font-size="13" fill="#a89f92" text-anchor="middle" font-weight="400">三者可以疊加。決定作品性格的，是你讓哪一種佔多少比重。</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>