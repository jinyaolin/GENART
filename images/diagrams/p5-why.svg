<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="270" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">為什麼這門課用 p5.js</text><rect x="26" y="95" width="130" height="90" rx="9" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="91" y="130" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">好學</text><text x="91" y="158" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">語法簡潔</text><rect x="164" y="95" width="130" height="90" rx="9" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="229" y="130" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600">視覺導向</text><text x="229" y="158" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">邊寫邊看到結果</text><rect x="302" y="95" width="130" height="90" rx="9" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="367" y="130" font-size="14" fill="#d98a7b" text-anchor="middle" font-weight="600">社群</text><text x="367" y="158" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">大量教學與範例</text><rect x="440" y="95" width="130" height="90" rx="9" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="505" y="130" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">跨平台</text><text x="505" y="158" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">有瀏覽器就能跑</text><rect x="578" y="95" width="130" height="90" rx="9" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="643" y="130" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600">可擴充</text><text x="643" y="158" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">能接其他函式庫</text><text x="360" y="220" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">基於 JavaScript，所以你的作品在任何有瀏覽器的裝置上都能跑</text><text x="360" y="244" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">不必安裝外掛，把網址傳給別人就是發表</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>