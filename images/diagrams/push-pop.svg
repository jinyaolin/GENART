<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="290" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">push() 與 pop()：把座標系隔開</text><text x="150" y="78" font-size="13" fill="#d98a7b" text-anchor="middle" font-weight="600">沒有 push/pop</text><rect x="60" y="92" width="180" height="120" rx="6" fill="none" stroke="#3a3026" stroke-width="1.5"/><g transform="translate(150,152) rotate(0.0)"><rect x="-34" y="-16" width="68" height="32" rx="4" fill="none" stroke="#d98a7b" stroke-width="1.8"/></g><g transform="translate(150,152) rotate(22.400000000000002)"><rect x="-34" y="-16" width="68" height="32" rx="4" fill="none" stroke="#d98a7b" stroke-width="1.8"/></g><g transform="translate(150,152) rotate(44.800000000000004)"><rect x="-34" y="-16" width="68" height="32" rx="4" fill="none" stroke="#d98a7b" stroke-width="1.8"/></g><text x="150" y="232" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">旋轉會累加，越畫越歪</text><text x="560" y="78" font-size="13" fill="#6fbfae" text-anchor="middle" font-weight="600">有 push/pop</text><rect x="470" y="92" width="180" height="120" rx="6" fill="none" stroke="#3a3026" stroke-width="1.5"/><g transform="translate(508,152) rotate(12)"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="none" stroke="#6fbfae" stroke-width="1.8"/></g><g transform="translate(560,152) rotate(12)"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="none" stroke="#6fbfae" stroke-width="1.8"/></g><g transform="translate(612,152) rotate(12)"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="none" stroke="#6fbfae" stroke-width="1.8"/></g><text x="560" y="232" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">每個物件各自獨立</text><text x="360" y="262" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">push() 存下目前的座標系與樣式，pop() 還原。</text><text x="360" y="284" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">中間怎麼 translate、rotate、scale 都不會影響到外面。</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>