<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="300" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">螢幕的像素，對應到複平面的一個點</text><rect x="70" y="90" width="230" height="180" rx="6" fill="none" stroke="#3a3026" stroke-width="1.4"/><line x1="108" y1="90" x2="108" y2="270" stroke="#3a3026" stroke-width="0.6" opacity="0.5"/><line x1="70" y1="120" x2="300" y2="120" stroke="#3a3026" stroke-width="0.6" opacity="0.5"/><line x1="146" y1="90" x2="146" y2="270" stroke="#3a3026" stroke-width="0.6" opacity="0.5"/><line x1="70" y1="150" x2="300" y2="150" stroke="#3a3026" stroke-width="0.6" opacity="0.5"/><line x1="184" y1="90" x2="184" y2="270" stroke="#3a3026" stroke-width="0.6" opacity="0.5"/><line x1="70" y1="180" x2="300" y2="180" stroke="#3a3026" stroke-width="0.6" opacity="0.5"/><line x1="222" y1="90" x2="222" y2="270" stroke="#3a3026" stroke-width="0.6" opacity="0.5"/><line x1="70" y1="210" x2="300" y2="210" stroke="#3a3026" stroke-width="0.6" opacity="0.5"/><line x1="260" y1="90" x2="260" y2="270" stroke="#3a3026" stroke-width="0.6" opacity="0.5"/><line x1="70" y1="240" x2="300" y2="240" stroke="#3a3026" stroke-width="0.6" opacity="0.5"/><rect x="184" y="180" width="38" height="30" rx="2" fill="#f0c87d" stroke="#f0c87d" stroke-width="0" opacity="0.85"/><text x="185" y="290" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">螢幕座標 (x, y)</text><line x1="310" y1="180" x2="380" y2="180" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><text x="345" y="168" font-size="11" fill="#f0c87d" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">map()</text><line x1="420" y1="180" x2="640" y2="180" stroke="#3a3026" stroke-width="1.4"/><line x1="530" y1="90" x2="530" y2="270" stroke="#3a3026" stroke-width="1.4"/><text x="648" y="184" font-size="11" fill="#a89f92" text-anchor="start" font-weight="400">實部 a</text><text x="530" y="80" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">虛部 b</text><circle cx="574" cy="144" r="5" fill="#f0c87d" stroke="#f0c87d" stroke-width="0"/><text x="582" y="134" font-size="11.5" fill="#f0c87d" text-anchor="start" font-weight="400">c = a + bi</text><text x="530" y="290" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">複平面上的一個複數</text><text x="360" y="84" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">把 x 對到 −2～2 的實部，y 對到 −2～2 的虛部</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>