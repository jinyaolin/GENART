<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="262" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">演算法就是食譜</text><text x="215" y="78" font-size="15" fill="#d98a7b" text-anchor="middle" font-weight="600">食譜</text><text x="505" y="78" font-size="15" fill="#e0a94e" text-anchor="middle" font-weight="600">演算法</text><rect x="120" y="105" width="190" height="42" rx="7" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="215" y="131" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">材料</text><line x1="315" y1="126" x2="405" y2="126" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="410" y="105" width="190" height="42" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="505" y="131" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">輸入資料</text><rect x="120" y="157" width="190" height="42" rx="7" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="215" y="183" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">順序與做法</text><line x1="315" y1="178" x2="405" y2="178" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="410" y="157" width="190" height="42" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="505" y="183" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">運算規則</text><rect x="120" y="209" width="190" height="42" rx="7" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="215" y="235" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">一道菜</text><line x1="315" y1="230" x2="405" y2="230" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="410" y="209" width="190" height="42" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="505" y="235" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">輸出結果</text><text x="360" y="232" font-size="13" fill="#a89f92" text-anchor="middle" font-weight="400">差別只在執行者：食譜給人看，演算法給電腦跑。你沒寫的，電腦一定不做。</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>