<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="270" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">藝術家控制的是什麼</text><rect x="50" y="70" width="280" height="150" rx="10" fill="none" stroke="#3a3026" stroke-width="2"/><text x="190" y="96" font-size="15" fill="#a89f92" text-anchor="middle" font-weight="600">傳統藝術</text><rect x="80" y="120" width="220" height="40" rx="7" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="190" y="145" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">每一筆</text><line x1="190" y1="163" x2="190" y2="186" stroke="#d98a7b" stroke-width="2" marker-end="url(#ar)"/><text x="190" y="204" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">一件固定的作品</text><rect x="390" y="70" width="280" height="150" rx="10" fill="none" stroke="#3a3026" stroke-width="2"/><text x="530" y="96" font-size="15" fill="#f0c87d" text-anchor="middle" font-weight="600">生成式藝術</text><rect x="420" y="120" width="220" height="40" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="530" y="145" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">產生每一筆的規則</text><line x1="530" y1="163" x2="460" y2="186" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)" opacity="0.75"/><line x1="530" y1="163" x2="530" y2="186" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)" opacity="0.75"/><line x1="530" y1="163" x2="600" y2="186" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)" opacity="0.75"/><text x="530" y="204" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">一整個作品的族群</text><text x="360" y="248" font-size="13" fill="#a89f92" text-anchor="middle" font-weight="400">規則寫一次，可以跑出上千張。你要判斷的是那一千張，不是其中一張。</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>