<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="290" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">Barnsley 蕨：形狀是從四個機率裡浮現的</text><rect x="45" y="88" width="150" height="96" rx="8" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="120" y="120" font-size="20" fill="#d98a7b" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">1%</text><text x="120" y="146" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">莖</text><text x="120" y="168" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">x=0, y=0.16y</text><rect x="208" y="88" width="150" height="96" rx="8" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="283" y="120" font-size="20" fill="#e0a94e" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">85%</text><text x="283" y="146" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">主葉往上長</text><text x="283" y="168" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">旋轉 + 位移</text><rect x="371" y="88" width="150" height="96" rx="8" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="446" y="120" font-size="20" fill="#6fbfae" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">7%</text><text x="446" y="146" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">左邊小葉</text><text x="446" y="168" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">另一組旋轉</text><rect x="534" y="88" width="150" height="96" rx="8" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="609" y="120" font-size="20" fill="#6fbfae" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">7%</text><text x="609" y="146" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">右邊小葉</text><text x="609" y="168" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">鏡像的旋轉</text><text x="360" y="216" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">沒有任何一行程式在「畫一片葉子」。程式只是不斷跳點。</text><text x="360" y="244" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">跳個十萬次之後，蕨葉的形狀自己出現</text><text x="360" y="270" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">這叫迭代函數系統（IFS）</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>