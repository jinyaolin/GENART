<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="290" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">遊戲：四種程序生成</text><rect x="32" y="85" width="158" height="110" rx="9" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="111" y="118" font-size="15" fill="#e0a94e" text-anchor="middle" font-weight="600">地形</text><text x="111" y="146" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Minecraft</text><text x="111" y="172" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">每個世界都獨一無二</text><rect x="202" y="85" width="158" height="110" rx="9" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="281" y="118" font-size="15" fill="#6fbfae" text-anchor="middle" font-weight="600">關卡</text><text x="281" y="146" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Spelunky</text><text x="281" y="172" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">每次開局重新生成</text><rect x="372" y="85" width="158" height="110" rx="9" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="451" y="118" font-size="15" fill="#d98a7b" text-anchor="middle" font-weight="600">劇情事件</text><text x="451" y="146" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">RimWorld</text><text x="451" y="172" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">每輪故事都不一樣</text><rect x="542" y="85" width="158" height="110" rx="9" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="621" y="118" font-size="15" fill="#e0a94e" text-anchor="middle" font-weight="600">生物角色</text><text x="621" y="146" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">No Man&#x27;s Sky</text><text x="621" y="172" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">無數種可能的物種</text><text x="360" y="228" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">手工做內容的成本隨世界大小線性增加</text><text x="360" y="252" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">程序生成把成本從「做內容」換成「做規則」</text><text x="360" y="276" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">代價是你得接受自己沒看過遊戲裡的每一個角落</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>