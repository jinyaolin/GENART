<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="300" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">兩種排序</text><text x="190" y="80" font-size="14" fill="#d98a7b" text-anchor="middle" font-weight="600">泡沫排序</text><rect x="120" y="126" width="18" height="24" rx="2" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><rect x="142" y="96" width="18" height="54" rx="2" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><rect x="164" y="132" width="18" height="18" rx="2" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><rect x="186" y="114" width="18" height="36" rx="2" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><rect x="208" y="102" width="18" height="48" rx="2" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><rect x="230" y="138" width="18" height="12" rx="2" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><rect x="252" y="144" width="18" height="6" rx="2" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><rect x="274" y="102" width="18" height="48" rx="2" fill="#d98a7b" stroke="#d98a7b" stroke-width="0"/><text x="190" y="172" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">比較相鄰兩個，需要就交換</text><text x="190" y="196" font-size="13" fill="#d98a7b" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">O(n²)</text><text x="190" y="220" font-size="11" fill="#6d6459" text-anchor="middle" font-weight="400">掃過整個陣列很多次</text><text x="530" y="80" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600">快速排序</text><rect x="455" y="120" width="40" height="30" rx="4" fill="none" stroke="#f0c87d" stroke-width="1.6"/><text x="475" y="140" font-size="11" fill="#f0c87d" text-anchor="middle" font-weight="400">基準</text><line x1="475" y1="152" x2="410" y2="176" stroke="#6fbfae" stroke-width="1.5" marker-end="url(#ar)"/><line x1="475" y1="152" x2="540" y2="176" stroke="#6fbfae" stroke-width="1.5" marker-end="url(#ar)"/><text x="390" y="192" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">比它小</text><text x="560" y="192" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">比它大</text><text x="530" y="220" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">再對兩堆各自快速排序</text><text x="530" y="246" font-size="13" fill="#6fbfae" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">O(n log n)</text><text x="360" y="282" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">一萬筆資料：泡沫要一億次比較，快排只要十三萬次</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>