<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="270" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">可重複，但不重現</text><rect x="60" y="110" width="180" height="58" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="150" y="137" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">同一支程式</text><text x="150" y="158" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">規則固定</text><line x1="240" y1="139" x2="296" y2="106" stroke="#3a3026" stroke-width="1.2"/><rect x="302" y="88" width="120" height="36" rx="6" fill="none" stroke="#f0c87d" stroke-width="1.5"/><text x="362" y="111" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">第一次執行</text><text x="452" y="111" font-size="11.5" fill="#a89f92" text-anchor="start" font-weight="400">長出不同的結果</text><line x1="240" y1="139" x2="296" y2="160" stroke="#3a3026" stroke-width="1.2"/><rect x="302" y="142" width="120" height="36" rx="6" fill="none" stroke="#6fbfae" stroke-width="1.5"/><text x="362" y="165" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">第二次執行</text><text x="452" y="165" font-size="11.5" fill="#a89f92" text-anchor="start" font-weight="400">長出不同的結果</text><line x1="240" y1="139" x2="296" y2="214" stroke="#3a3026" stroke-width="1.2"/><rect x="302" y="196" width="120" height="36" rx="6" fill="none" stroke="#d98a7b" stroke-width="1.5"/><text x="362" y="219" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">第三次執行</text><text x="452" y="219" font-size="11.5" fill="#a89f92" text-anchor="start" font-weight="400">長出不同的結果</text><text x="360" y="226" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">規則可重複，結果不重現。兩件事同時成立，才是生成式。</text><text x="360" y="252" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">差別在那些讓它自由的地方，以及自由到什麼程度</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>