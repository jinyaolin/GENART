<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="290" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">背包問題：容量固定，怎麼裝總價值最高</text><rect x="70" y="100" width="150" height="150" rx="10" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="145" y="126" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">背包</text><text x="145" y="148" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">容量 10 kg</text><rect x="260" y="110" width="88" height="74" rx="7" fill="none" stroke="#6fbfae" stroke-width="1.5"/><text x="304" y="136" font-size="15" fill="#6fbfae" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">A</text><text x="304" y="158" font-size="11" fill="#f2ece1" text-anchor="middle" font-weight="400">3 kg</text><text x="304" y="176" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">價值 4</text><rect x="365" y="110" width="88" height="74" rx="7" fill="none" stroke="#6fbfae" stroke-width="1.5"/><text x="409" y="136" font-size="15" fill="#6fbfae" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">B</text><text x="409" y="158" font-size="11" fill="#f2ece1" text-anchor="middle" font-weight="400">4 kg</text><text x="409" y="176" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">價值 5</text><rect x="470" y="110" width="88" height="74" rx="7" fill="none" stroke="#6fbfae" stroke-width="1.5"/><text x="514" y="136" font-size="15" fill="#6fbfae" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">C</text><text x="514" y="158" font-size="11" fill="#f2ece1" text-anchor="middle" font-weight="400">5 kg</text><text x="514" y="176" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">價值 8</text><rect x="575" y="110" width="88" height="74" rx="7" fill="none" stroke="#6fbfae" stroke-width="1.5"/><text x="619" y="136" font-size="15" fill="#6fbfae" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">D</text><text x="619" y="158" font-size="11" fill="#f2ece1" text-anchor="middle" font-weight="400">7 kg</text><text x="619" y="176" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">價值 9</text><text x="360" y="222" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">選 B + C：11 kg 超重。選 A + C：8 kg，價值 12。</text><text x="360" y="248" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">物品一多就不能窮舉，要用動態規劃填表</text><text x="360" y="276" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">最長共同子序列、最短路徑，也都是這一類</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>