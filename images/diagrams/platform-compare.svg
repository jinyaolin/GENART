<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="290" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">兩種平台，兩種取捨</text><rect x="50" y="88" width="300" height="140" rx="10" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="200" y="118" font-size="16" fill="#e0a94e" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Art Blocks</text><text x="200" y="146" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">以太坊・2021 年創立</text><text x="200" y="168" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">策展制，要審核</text><text x="200" y="190" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">等待名單可能好幾個月</text><text x="200" y="212" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">進去了就有品質背書</text><rect x="370" y="88" width="300" height="140" rx="10" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="520" y="118" font-size="16" fill="#6fbfae" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">fxhash</text><text x="520" y="146" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">Tezos・2021 年 11 月啟動</text><text x="520" y="168" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">無策展，人人皆可參與</text><text x="520" y="190" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">直接鑄造，不必排隊</text><text x="520" y="212" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">品質要自己判斷</text><text x="360" y="262" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">創立者 ciphrd 的理念是「無策展，人人皆可參與」</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>