<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="260" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">Art Blocks：收藏家按下鑄造之前，沒有人看過那張圖</text><rect x="45" y="90" width="150" height="58" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="120" y="117" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">藝術家</text><text x="120" y="138" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">上傳程式碼</text><line x1="195" y1="119" x2="233" y2="119" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="233" y="90" width="150" height="58" rx="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="308" y="117" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">區塊鏈</text><text x="308" y="138" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">程式碼進帳本</text><line x1="383" y1="119" x2="421" y2="119" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="421" y="90" width="150" height="58" rx="7" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="496" y="117" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">鑄造</text><text x="496" y="138" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">產生隨機雜湊</text><line x1="571" y1="119" x2="609" y2="119" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="609" y="90" width="150" height="58" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="684" y="117" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">作品</text><text x="684" y="138" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">雜湊餵進程式</text><text x="360" y="190" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">同一份程式碼 + 不同的雜湊 = 同一系列裡不重複的每一版</text><text x="360" y="220" font-size="12.5" fill="#6fbfae" text-anchor="middle" font-weight="400">程式碼本身就是作品，輸出只是它的一次執行結果</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>