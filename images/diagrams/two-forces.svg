<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="260" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">21 世紀：兩股力量同時發生</text><rect x="50" y="88" width="290" height="110" rx="10" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="195" y="116" font-size="15" fill="#e0a94e" text-anchor="middle" font-weight="600">技術面</text><text x="195" y="144" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">深度學習與 GAN</text><text x="195" y="170" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">能生出逼真的臉孔與風景</text><rect x="380" y="88" width="290" height="110" rx="10" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="525" y="116" font-size="15" fill="#6fbfae" text-anchor="middle" font-weight="600">市場面</text><text x="525" y="144" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">區塊鏈與 NFT</text><text x="525" y="170" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">直接賣給收藏家，不經畫廊</text><line x1="340" y1="143" x2="378" y2="143" stroke="#3a3026" stroke-width="2"/><text x="360" y="226" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">加上數位藝術本來就逐漸成為主流文化的一部分</text><text x="360" y="250" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">觀眾的接受度在這十年間明顯提高</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>