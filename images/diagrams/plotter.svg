<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="270" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">沒有螢幕可以預覽的年代</text><rect x="50" y="105" width="140" height="54" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="120" y="130" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">寫程式</text><text x="120" y="151" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">在腦中先成立</text><line x1="190" y1="132" x2="228" y2="132" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="233" y="105" width="140" height="54" rx="7" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="303" y="130" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">送去跑</text><text x="303" y="151" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">大型主機</text><line x1="373" y1="132" x2="411" y2="132" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="416" y="105" width="140" height="54" rx="7" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="486" y="130" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">繪圖機</text><text x="486" y="151" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">一筆一筆畫</text><line x1="556" y1="132" x2="594" y2="132" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><text x="645" y="128" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">幾小時後</text><text x="645" y="148" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">才看到結果</text><path d="M 486 165 L 486 196 L 120 196 L 120 163" fill="none" stroke="#3a3026" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="303" y="213" font-size="11.5" fill="#6d6459" text-anchor="middle" font-weight="400">錯了就重來一次</text><text x="360" y="244" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">早期電腦藝術的線條感，很大一部分來自繪圖機這支筆</text><text x="360" y="266" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">限制長出風格</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>