<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="270" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">時間與空間，常常要取捨</text><rect x="80" y="100" width="240" height="110" rx="10" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="200" y="132" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">多存中間結果</text><text x="200" y="160" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">計算變快</text><text x="200" y="184" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">記憶體吃更多</text><text x="360" y="155" font-size="26" fill="#f0c87d" text-anchor="middle" font-weight="400">⇄</text><rect x="400" y="100" width="240" height="110" rx="10" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="520" y="132" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600">少存、每次重算</text><text x="520" y="160" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">省記憶體</text><text x="520" y="184" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">計算變慢</text><text x="360" y="240" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">生成式藝術很常撞到這條線：想加細節，畫面就掉幀</text><text x="360" y="264" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">這時候要動的是演算法，不是電腦</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>