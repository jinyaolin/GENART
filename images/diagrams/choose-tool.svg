<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="302" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">怎麼選：三個問題</text><rect x="60" y="88" width="600" height="58" rx="8" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="200" y="122" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">你想做什麼樣的作品？</text><text x="430" y="112" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">網頁互動 → p5.js</text><text x="430" y="132" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">桌面／裝置 → Processing</text><rect x="60" y="154" width="600" height="58" rx="8" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="200" y="188" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">你熟哪種語言？</text><text x="430" y="178" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">JavaScript → p5.js</text><text x="430" y="198" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">C++ → openFrameworks</text><rect x="60" y="220" width="600" height="58" rx="8" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="200" y="254" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">你想學會什麼？</text><text x="430" y="244" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">先求做得出來 → p5.js</text><text x="430" y="264" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">要壓效能 → openFrameworks</text><text x="360" y="286" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">沒有最好的工具，只有這次比較順手的工具</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>