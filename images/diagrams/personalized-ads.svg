<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="270" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">同一支廣告，長出不同的樣子</text><rect x="60" y="105" width="150" height="58" rx="7" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="135" y="132" font-size="15" fill="#f2ece1" text-anchor="middle" font-weight="600">一組規則</text><text x="135" y="153" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">+ 觀看者資料</text><line x1="210" y1="134" x2="268" y2="108" stroke="#6fbfae" stroke-width="1.5" marker-end="url(#ar)"/><rect x="275" y="88" width="180" height="40" rx="6" fill="none" stroke="#6fbfae" stroke-width="1.5"/><text x="365" y="105" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">台北・雨天</text><text x="365" y="121" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">推溫泉行程</text><line x1="210" y1="134" x2="268" y2="164" stroke="#d98a7b" stroke-width="1.5" marker-end="url(#ar)"/><rect x="275" y="144" width="180" height="40" rx="6" fill="none" stroke="#d98a7b" stroke-width="1.5"/><text x="365" y="161" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">高雄・晴天</text><text x="365" y="177" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">推離島跳島</text><line x1="210" y1="134" x2="268" y2="220" stroke="#f0c87d" stroke-width="1.5" marker-end="url(#ar)"/><rect x="275" y="200" width="180" height="40" rx="6" fill="none" stroke="#f0c87d" stroke-width="1.5"/><text x="365" y="217" font-size="11.5" fill="#f2ece1" text-anchor="middle" font-weight="400">東京・深夜</text><text x="365" y="233" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">推早鳥優惠</text><text x="360" y="232" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">依時間、地點、天氣即時改變內容，Spotify 的個人化歌單廣告也是這樣做的</text><text x="360" y="256" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">規則寫一次，觀看者有幾種就長出幾種</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>