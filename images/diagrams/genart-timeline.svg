<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="250" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">生成式藝術的三個階段</text><line x1="60" y1="120" x2="660" y2="120" stroke="#3a3026" stroke-width="2"/><circle cx="150" cy="120" r="8" fill="#d98a7b" stroke="#d98a7b" stroke-width="2"/><text x="150" y="100" font-size="13" fill="#d98a7b" text-anchor="middle" font-weight="600">1950–1970</text><text x="150" y="152" font-size="14" fill="#f2ece1" text-anchor="middle" font-weight="600">當代藝術裡的隨機性</text><text x="150" y="174" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">機械・類比電子・觀眾</text><circle cx="360" cy="120" r="8" fill="#e0a94e" stroke="#e0a94e" stroke-width="2"/><text x="360" y="100" font-size="13" fill="#e0a94e" text-anchor="middle" font-weight="600">1970–2000</text><text x="360" y="152" font-size="14" fill="#f2ece1" text-anchor="middle" font-weight="600">電腦時代</text><text x="360" y="174" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">大型主機・繪圖機</text><circle cx="570" cy="120" r="8" fill="#6fbfae" stroke="#6fbfae" stroke-width="2"/><text x="570" y="100" font-size="13" fill="#6fbfae" text-anchor="middle" font-weight="600">2000–</text><text x="570" y="152" font-size="14" fill="#f2ece1" text-anchor="middle" font-weight="600">數位與區塊鏈</text><text x="570" y="174" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">個人電腦・瀏覽器・鏈上雜湊</text><text x="360" y="215" font-size="13" fill="#a89f92" text-anchor="middle" font-weight="400">用什麼跑規則變了，但「作者決定規則、系統決定結果」這件事沒變。</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>