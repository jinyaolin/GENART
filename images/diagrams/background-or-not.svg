<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="290" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">draw() 裡有沒有 background()</text><rect x="60" y="80" width="270" height="150" rx="8" fill="none" stroke="#3a3026" stroke-width="1.5"/><text x="195" y="104" font-size="14" fill="#d98a7b" text-anchor="middle" font-weight="600">有：每幀先塗掉</text><circle cx="195" cy="160" r="16" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="195" y="208" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">看到的是動畫</text><rect x="390" y="80" width="270" height="150" rx="8" fill="none" stroke="#3a3026" stroke-width="1.5"/><text x="525" y="104" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600">沒有：畫面累積</text><circle cx="435" cy="160" r="6" fill="none" stroke="#6fbfae" stroke-width="1.6" opacity="0.35"/><circle cx="457.5" cy="171.683" r="7.25" fill="none" stroke="#6fbfae" stroke-width="1.6" opacity="0.425"/><circle cx="480" cy="181.521" r="8.5" fill="none" stroke="#6fbfae" stroke-width="1.6" opacity="0.5"/><circle cx="502.5" cy="187.961" r="9.75" fill="none" stroke="#6fbfae" stroke-width="1.6" opacity="0.575"/><circle cx="525" cy="189.987" r="11" fill="none" stroke="#6fbfae" stroke-width="1.6" opacity="0.6499999999999999"/><circle cx="547.5" cy="187.279" r="12.25" fill="none" stroke="#6fbfae" stroke-width="1.6" opacity="0.725"/><circle cx="570" cy="180.264" r="13.5" fill="none" stroke="#6fbfae" stroke-width="1.6" opacity="0.7999999999999999"/><circle cx="592.5" cy="170.05" r="14.75" fill="none" stroke="#6fbfae" stroke-width="1.6" opacity="0.875"/><circle cx="615" cy="158.249" r="16" fill="none" stroke="#6fbfae" stroke-width="1.6" opacity="0.95"/><text x="525" y="208" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">看到的是軌跡</text><text x="360" y="258" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">`background()` 會把畫布上所有東西清掉，再塗上你指定的顏色。</text><text x="360" y="280" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">拿掉它，先前畫的就留著。整章最關鍵的一行，就是這一行在不在。</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>