<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="270" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">一個神經元怎麼運作</text><line x1="80" y1="114" x2="168" y2="152" stroke="#6fbfae" stroke-width="1.6" marker-end="url(#ar)"/><line x1="80" y1="152" x2="168" y2="152" stroke="#6fbfae" stroke-width="1.6" marker-end="url(#ar)"/><line x1="80" y1="190" x2="168" y2="152" stroke="#6fbfae" stroke-width="1.6" marker-end="url(#ar)"/><text x="72" y="110" font-size="11.5" fill="#6fbfae" text-anchor="end" font-weight="400">突觸</text><text x="72" y="128" font-size="10.5" fill="#a89f92" text-anchor="end" font-weight="400">收其他神經元的訊息</text><circle cx="200" cy="152" r="32" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="200" y="148" font-size="12" fill="#e0a94e" text-anchor="middle" font-weight="600">細胞體</text><text x="200" y="166" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">累加</text><line x1="232" y1="152" x2="300" y2="152" stroke="#e0a94e" stroke-width="2" marker-end="url(#ar)"/><rect x="305" y="132" width="120" height="40" rx="6" fill="none" stroke="#f0c87d" stroke-width="2"/><text x="365" y="157" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">超過閾值？</text><line x1="425" y1="152" x2="505" y2="152" stroke="#f0c87d" stroke-width="2" marker-end="url(#ar)"/><text x="465" y="140" font-size="11" fill="#f0c87d" text-anchor="middle" font-weight="400">激發</text><line x1="510" y1="152" x2="650" y2="152" stroke="#d98a7b" stroke-width="2.6" marker-end="url(#ar)"/><text x="580" y="138" font-size="11.5" fill="#d98a7b" text-anchor="middle" font-weight="400">軸突</text><text x="580" y="176" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">傳給下一個神經元</text><text x="360" y="222" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">累積的訊號強度沒超過閾值，這個神經元就不會發出任何東西</text><text x="360" y="248" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">人腦裡每個神經元可能連著上千個其他神經元</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>