<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="280" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">那個 √3 從哪來</text><polygon points="250,220 440,220 345,55.4552" fill="none" stroke="#e0a94e" stroke-width="2"/><line x1="345" y1="55.4552" x2="345" y2="220" stroke="#6fbfae" stroke-width="1.6" stroke-dasharray="4 3"/><text x="355" y="174" font-size="12" fill="#6fbfae" text-anchor="start" font-weight="400">高 = 邊長 × √3/2</text><text x="345" y="242" font-size="12" fill="#e0a94e" text-anchor="middle" font-weight="400">邊長</text><text x="360" y="84" font-size="13" fill="#f2ece1" text-anchor="middle" font-weight="400">等邊三角形的高，是邊長的 √3 / 2</text><text x="360" y="250" font-size="12.5" fill="#f0c87d" text-anchor="middle" font-weight="400">Koch 的中段長度是 dx/3，所以尖端要突出 dx/3 × √3/2 = dx/(2√3)</text><text x="360" y="274" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">幾何先算好，程式只是把它抄下來</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>