<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="290" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">底層的數學與邏輯</text><text x="190" y="84" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">四塊數學</text><rect x="70" y="100" width="240" height="36" rx="6" fill="none" stroke="#e0a94e" stroke-width="1.4"/><text x="190" y="116" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">集合與資料結構</text><text x="190" y="131" font-size="10" fill="#a89f92" text-anchor="middle" font-weight="400">陣列、樹怎麼運作</text><rect x="70" y="144" width="240" height="36" rx="6" fill="none" stroke="#e0a94e" stroke-width="1.4"/><text x="190" y="160" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">函數與極限</text><text x="190" y="175" font-size="10" fill="#a89f92" text-anchor="middle" font-weight="400">複雜度分析</text><rect x="70" y="188" width="240" height="36" rx="6" fill="none" stroke="#e0a94e" stroke-width="1.4"/><text x="190" y="204" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">機率與統計</text><text x="190" y="219" font-size="10" fill="#a89f92" text-anchor="middle" font-weight="400">隨機演算法、機器學習</text><rect x="70" y="232" width="240" height="36" rx="6" fill="none" stroke="#e0a94e" stroke-width="1.4"/><text x="190" y="248" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">線性代數與微積分</text><text x="190" y="263" font-size="10" fill="#a89f92" text-anchor="middle" font-weight="400">進階演算法</text><text x="530" y="84" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600">三塊邏輯</text><rect x="410" y="100" width="240" height="36" rx="6" fill="none" stroke="#6fbfae" stroke-width="1.4"/><text x="530" y="116" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">命題邏輯</text><text x="530" y="131" font-size="10" fill="#a89f92" text-anchor="middle" font-weight="400">與、或、非怎麼組合</text><rect x="410" y="144" width="240" height="36" rx="6" fill="none" stroke="#6fbfae" stroke-width="1.4"/><text x="530" y="160" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">條件與迴圈</text><text x="530" y="175" font-size="10" fill="#a89f92" text-anchor="middle" font-weight="400">if、while、for</text><rect x="410" y="188" width="240" height="36" rx="6" fill="none" stroke="#6fbfae" stroke-width="1.4"/><text x="530" y="204" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">證明技巧</text><text x="530" y="219" font-size="10" fill="#a89f92" text-anchor="middle" font-weight="400">確認演算法真的對</text><text x="360" y="278" font-size="12.5" fill="#a89f92" text-anchor="middle" font-weight="400">不必全部精通，但看到名詞要知道它在指什麼</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>