<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img"><rect width="720" height="270" rx="10" fill="#1d1811"/><text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">四個值得關注的方向</text><rect x="32" y="95" width="158" height="96" rx="9" fill="none" stroke="#e0a94e" stroke-width="2"/><text x="111" y="132" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">量子計算</text><text x="111" y="162" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">Shor・Grover</text><rect x="202" y="95" width="158" height="96" rx="9" fill="none" stroke="#6fbfae" stroke-width="2"/><text x="281" y="132" font-size="14" fill="#6fbfae" text-anchor="middle" font-weight="600">生成式藝術</text><text x="281" y="162" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">GAN 進入藝術市場</text><rect x="372" y="95" width="158" height="96" rx="9" fill="none" stroke="#d98a7b" stroke-width="2"/><text x="451" y="132" font-size="14" fill="#d98a7b" text-anchor="middle" font-weight="600">自動化決策</text><text x="451" y="162" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">自動交易・自駕車</text><rect x="542" y="95" width="158" height="96" rx="9" fill="none" stroke="#f0c87d" stroke-width="2"/><text x="621" y="132" font-size="14" fill="#f0c87d" text-anchor="middle" font-weight="600">強化學習</text><text x="621" y="162" font-size="10.5" fill="#a89f92" text-anchor="middle" font-weight="400">從錯誤中找最佳策略</text><text x="360" y="228" font-size="12.5" fill="#f2ece1" text-anchor="middle" font-weight="400">四個方向都有一個共同點：讓機器承擔更多原本由人做的判斷</text><text x="360" y="254" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">所以技術之外，還要問它會影響誰</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0a94e"/></marker></defs></svg>